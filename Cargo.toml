[package]
name = "barrel-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Register and track desktop app releases with Barrel."
repository = "https://github.com/barrelsystems/cli"

[lib]
name = "barrel_cli"
path = "src/lib.rs"

[[bin]]
name = "barrel"
path = "src/main.rs"

[dependencies]
indicatif = { version = "0.18.6", default-features = false }
clap = { version = "4.5.37", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
json_comments = "0.2.2"
sha2 = "0.10.8"
base64 = "0.22.1"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1.16.0", features = ["v4"] }
thiserror = "2.0.12"

[dev-dependencies]
trycmd = "0.15.9"
tempfile = "3.19.1"
